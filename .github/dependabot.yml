# Dependabot: седмични заявки за обновяване на Python пакетите и месечни за GitHub Actions.
# Предупрежденията за пробиви в сигурността идват отделно (Security → Dependabot alerts).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    ignore:
      # Оставаме на Django 5.2 LTS (поддръжка до април 2028): Django 6.x изисква
      # MySQL 8.4+, а училищните сървъри обикновено са с MySQL 8.0.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
    groups:
      django:
        patterns: ["django", "django-*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
