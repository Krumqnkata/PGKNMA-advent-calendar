name: Тестове

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Тестове (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: advent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      DB_ENGINE: ${{ matrix.db }}
      DB_NAME: advent
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Системни библиотеки за mysqlclient
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Инсталиране на зависимостите
        run: pip install -r requirements.txt

      - name: Проверка на проекта
        run: python manage.py check

      - name: Няма липсващи миграции
        run: python manage.py makemigrations --check --dry-run

      - name: Статични файлове
        run: python manage.py collectstatic --noinput

      - name: Тестове
        run: python manage.py test doors
