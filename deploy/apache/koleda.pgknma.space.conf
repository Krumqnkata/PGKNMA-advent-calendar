# Адвент календар – koleda.pgknma.space
# Посетител → Cloudflare (HTTPS) → Apache :8443 (Cloudflare Origin сертификат)
#          → Waitress 127.0.0.1:8003 → Django
# /static/ и /media/ се сервират директно от Apache.
#
# Сложи в /etc/apache2/sites-available/koleda.pgknma.space.conf и пусни:
#   sudo a2enmod ssl proxy proxy_http headers
#   sudo a2ensite koleda.pgknma.space
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:8443>
    ServerName koleda.pgknma.space

    SSLEngine on
    # Origin сертификатът от Cloudflare трябва да покрива *.pgknma.space (виж DEPLOY.md, стъпка 1)
    SSLCertificateFile /etc/ssl/certs/cloudflare.pem
    SSLCertificateKeyFile /etc/ssl/private/cloudflare.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    # Истинският IP на посетителя: от CF-Connecting-IP към X-Forwarded-For.
    # Waitress вярва на тази заглавка само от 127.0.0.1 (виж serve.py), а Django
    # и ограничението на опитите за вход (django-axes) я виждат като REMOTE_ADDR.
    ProxyAddHeaders Off
    ProxyPreserveHost On
    SetEnvIf CF-Connecting-IP "^(.+)$" REAL_CLIENT_IP=$1
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-For "%{REAL_CLIENT_IP}e" env=REAL_CLIENT_IP
    RequestHeader set X-Forwarded-Proto "https"

    LogFormat "%{CF-Connecting-IP}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" koleda_cf
    ErrorLog ${APACHE_LOG_DIR}/koleda_error.log
    CustomLog ${APACHE_LOG_DIR}/koleda_access.log koleda_cf

    # ---------------------------------------------------------------------
    # Статични файлове (CSS/JS/шрифтове/лого): имената съдържат хеш, затова
    # могат да се кешират завинаги – при промяна името се сменя.
    # ---------------------------------------------------------------------
    ProxyPass /static/ !
    Alias /static/ /var/www/koleda/staticfiles/
    <Directory /var/www/koleda/staticfiles>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # ---------------------------------------------------------------------
    # Качени снимки (вратички, лого). Имената на снимките са случайни, а
    # списък на папката не се показва – бъдещите снимки не могат да се открият.
    # ---------------------------------------------------------------------
    ProxyPass /media/ !
    Alias /media/ /var/www/koleda/media/
    <Directory /var/www/koleda/media>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header set X-Content-Type-Options "nosniff"
        Header set Cache-Control "public, max-age=86400"
        # Каченото съдържание никога не се изпълнява и не се показва като страница
        <FilesMatch "\.(?i:php\d?|phtml|py|pl|cgi|sh|html?|svg)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # ---------------------------------------------------------------------
    # Всичко останало → Django (Waitress). Порт 8003.
    # ---------------------------------------------------------------------
    ProxyPass        / http://127.0.0.1:8003/ timeout=60
    ProxyPassReverse / http://127.0.0.1:8003/
</VirtualHost>
